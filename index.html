<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REYZENITH: SMOOTH_SYNC (v41.0)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Share+Tech+Mono&display=swap');
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Share Tech Mono', monospace; color: #fff; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: absolute; inset: 0; pointer-events: none; padding: 15px; z-index: 100; }
        .tag { display: inline-block; padding: 4px 10px; font-size: 10px; font-weight: bold; border: 1px solid #fff; margin-top: 5px; }
        #m-ui { position: absolute; bottom: 25px; width: 100%; display: none; justify-content: space-between; padding: 0 25px; pointer-events: auto; }
        .btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #0f0; background: rgba(0,255,100,0.1); display: flex; align-items: center; justify-content: center; font-size: 8px; font-family: 'Syncopate'; color: #0f0; }
        @media (max-width: 900px) { #m-ui { display: flex; } }
    </style>
</head>
<body>
<div id="ui">
    <div style="font-family:'Syncopate'; font-size: 14px; color: #0f0;">SMOOTH_v41</div>
    <div id="e-tag" class="tag" style="background:#ff4500; color:#000;">API</div>
</div>
<div id="m-ui">
    <div style="display:flex; gap:5px;"><div class="btn" id="b-l">L</div><div class="btn" id="b-r">R</div></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
        <div class="btn" id="b-t" style="border-color:#ff0">ELEM</div>
        <div class="btn" id="b-j" style="width:100%; border-color:#f05">SLASH</div>
    </div>
</div>
<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    // --- CONFIG ASET (PASTIKAN NAMA FILE BENAR) ---
    const spr = {
        idle: new Image(), run: new Image(), atkL: new Image(), atkR: new Image(),
        w: 64, h: 64, frames: 8, cur: 0, tick: 0, spd: 7 // spd diperlambat agar lebih halus
    };

    spr.idle.src = "assets/player_idle.jpg"; 
    spr.run.src  = "assets/player_run.png";  
    spr.atkL.src = "assets/player_atk_L.jpg"; 
    spr.atkR.src = "assets/player_atk_R.jpg"; 

    const ELEMS = [{n:'API',c:'#ff4500'}, {n:'ES',c:'#00ffff'}, {n:'PETIR',c:'#ffff00'}];
    let d = {eIdx:0};
    let p = {x:200, y:0, vx:0, vy:0, w:80, h:80, dir:-1, state:'idle'};
    let world = {floor:canvas.height-120, grav:0.8, camX:0};
    const keys = {};

    function switchE(){ d.eIdx=(d.eIdx+1)%ELEMS.length; document.getElementById('e-tag').innerText=ELEMS[d.eIdx].n; document.getElementById('e-tag').style.background=ELEMS[d.eIdx].c; }
    
    function doAtk(){ 
        if(p.state.startsWith('atk')) return; 
        p.state = p.dir === -1 ? 'atkL' : 'atkR'; 
        spr.cur = 0; spr.tick = 0; // Reset total agar animasi mulai dari awal
        if(navigator.vibrate) navigator.vibrate(40); 
    }

    // Input Logic
    window.onkeydown=(e)=>{ keys[e.code]=true; if(e.code==='KeyT') switchE(); if(e.code==='KeyJ') doAtk(); if((e.code==='Space'||e.code==='KeyW')&&p.y>=world.floor-p.h) p.vy=-16; };
    window.onkeyup=(e)=>{ keys[e.code]=false; };
    function bind(id,k,act){ let el=document.getElementById(id); el.addEventListener('touchstart',(e)=>{e.preventDefault(); if(act)act(); else keys[k]=true;}); el.addEventListener('touchend',(e)=>{e.preventDefault(); keys[k]=false;}); }
    bind('b-l','KeyA'); bind('b-r','KeyD'); bind('b-t',null,switchE); bind('b-j',null,doAtk);

    function loop(){
        // Reset state jika tidak sedang attack
        if(!p.state.startsWith('atk')) {
            if(Math.abs(p.vx) > 0.5) p.state = 'run';
            else p.state = 'idle';
        }

        // Move
        if(keys['KeyA']){ p.vx=-8; p.dir=-1; } else if(keys['KeyD']){ p.vx=8; p.dir=1; } else p.vx*=0.8;
        p.vy+=world.grav; p.x+=p.vx; p.y+=p.vy;
        if(p.y>world.floor-p.h){ p.y=world.floor-p.h; p.vy=0; }

        // Anim Counter
        spr.tick++;
        if(spr.tick >= spr.spd) {
            spr.tick = 0; spr.cur++;
            if(spr.cur >= spr.frames) {
                spr.cur = 0;
                if(p.state.startsWith('atk')) p.state = 'idle';
            }
        }

        world.camX+=(p.x-canvas.width/2-world.camX)*0.1;
        draw(); requestAnimationFrame(loop);
    }

    function draw(){
        // Bersihkan layar sepenuhnya
        ctx.fillStyle="#000"; 
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.save(); 
        ctx.translate(-world.camX, 0);
        
        // Lantai
        ctx.fillStyle="#111"; 
        ctx.fillRect(world.camX-100, world.floor, canvas.width+200, 200);
        ctx.strokeStyle=ELEMS[d.eIdx].c; 
        ctx.lineWidth=3; 
        ctx.strokeRect(world.camX-100, world.floor, canvas.width+200, 3);

        let img = spr[p.state] || spr.idle;
        if(img.complete) {
            ctx.save();
            // PIVOT: Pastikan posisi kaki tetap di lantai saat ganti animasi
            ctx.translate(p.x + p.w/2, p.y + p.h); 
            
            // Mirror Run ke kanan (karena file run lari ke kiri)
            if(p.state === 'run' && p.dir === 1) ctx.scale(-1, 1);
            
            // DrawImage dengan source rect yang presisi
            ctx.drawImage(
                img, 
                Math.floor(spr.cur) * spr.w, 0, spr.w, spr.h, // Source
                -p.w/2, -p.h, p.w, p.h // Destination
            );
            ctx.restore();
        }
        ctx.restore();
    }
    loop();
</script>
</body>
</html>
